<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #fff; }
  #banner { position: relative; width: 794px; height: 460px; overflow: hidden;
    background: radial-gradient(circle at 12% 8%, #6366f1 0%, rgba(99,102,241,0) 46%),
                radial-gradient(circle at 92% 96%, #0ea5e9 0%, rgba(14,165,233,0) 52%),
                linear-gradient(135deg, #312e81 0%, #1e3a8a 100%); }
  .c { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.07); }
  .c1 { width: 420px; height: 420px; right: -120px; top: -90px; }
  .c2 { width: 260px; height: 260px; right: 120px; bottom: -130px; background: rgba(255,255,255,0.06); }
  .c3 { width: 120px; height: 120px; left: 430px; top: 60px; background: rgba(255,255,255,0.05); }
  .logo { position: absolute; left: 60px; top: 56px; width: 74px; height: 74px; border-radius: 22px;
    background: linear-gradient(135deg, #f8887c, #ea4335); display: grid; place-items: center;
    box-shadow: 0 14px 30px rgba(0,0,0,0.30); }
  .tag { position: absolute; left: 152px; top: 74px; color: #fff; font: 700 15px "Segoe UI", Arial, sans-serif; letter-spacing: 0.22em; opacity: 0.9; }
  .tag small { display: block; font-weight: 400; letter-spacing: 0.04em; opacity: 0.75; margin-top: 3px; font-size: 13px; }
  .chips { position: absolute; left: 60px; bottom: 34px; display: flex; gap: 10px; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,0.14);
    color: #fff; font: 600 13px "Segoe UI", Arial, sans-serif; border: 1px solid rgba(255,255,255,0.22); }
  .chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  #stripe { width: 794px; height: 8px; background: linear-gradient(90deg, #ea4335, #f59e0b, #16a34a, #2563eb, #8b5cf6); }
</style>
</head>
<body>
<div id="banner">
  <div class="c c1"></div><div class="c c2"></div><div class="c c3"></div>
  <div class="logo">
    <svg width="44" height="44" viewBox="0 0 24 24"><path id="gm" fill="#fff" d=""/></svg>
  </div>
  <div class="tag">DOKUMEN TEKNIS<small>Aplikasi Notifikasi Email</small></div>
  <div class="chips">
    <span class="chip"><i style="background:#60a5fa"></i>Vue 3</span>
    <span class="chip"><i style="background:#34d399"></i>Node.js + Express</span>
    <span class="chip"><i style="background:#fbbf24"></i>SQLite</span>
    <span class="chip"><i style="background:#f87171"></i>Gmail SMTP</span>
  </div>
</div>
<div id="stripe"></div>
</body>
</html>
